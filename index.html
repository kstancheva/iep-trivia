<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IEP Team Trivia Quiz</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 30px; }
.container { max-width: 800px; margin: 0 auto; }
.header { text-align: center; color: white; margin-bottom: 30px; }
.header h1 { font-size: 32px; margin-bottom: 8px; }
.header p { font-size: 16px; opacity: 0.9; }
.score-bar { background: rgba(255,255,255,0.15); border-radius: 12px; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 20px; font-size: 14px; }
.score-bar .progress { font-weight: 600; }
.timer-display { font-size: 13px; opacity: 0.9; }
.card { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); margin-bottom: 20px; }
.question-num { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 8px; }
.question { font-size: 18px; font-weight: 600; color: #2d2d2d; margin-bottom: 24px; line-height: 1.5; }
.options { display: flex; flex-direction: column; gap: 12px; }
.option { padding: 14px 20px; border: 2px solid #e8e8e8; border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 15px; color: #333; }
.option:hover { border-color: #667eea; background: #f8f7ff; }
.option.correct { border-color: #2ecc71; background: #e8faf0; color: #1a7a4c; font-weight: 600; }
.option.wrong { border-color: #e74c3c; background: #fef0f0; color: #c0392b; }
.option.disabled { pointer-events: none; opacity: 0.7; }
.btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
.btn:hover { transform: scale(1.02); }
.btn-row { text-align: right; margin-top: 20px; }
.feedback { margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
.feedback.correct { background: #e8faf0; color: #1a7a4c; border-left: 4px solid #2ecc71; }
.feedback.wrong { background: #fef0f0; color: #c0392b; border-left: 4px solid #e74c3c; }
.hidden { display: none; }
/* Name entry */
.name-input { width: 100%; padding: 14px 20px; border: 2px solid #e8e8e8; border-radius: 10px; font-size: 16px; font-family: 'Segoe UI', sans-serif; margin-bottom: 16px; }
.name-input:focus { outline: none; border-color: #667eea; }
/* Answer tracker */
.tracker { margin-top: 24px; border-top: 1px solid #eee; padding-top: 20px; }
.tracker h3 { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.tracker-item { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; line-height: 1.5; }
.tracker-item.correct { background: #f0faf5; border-left: 3px solid #2ecc71; }
.tracker-item.wrong { background: #fef8f8; border-left: 3px solid #e74c3c; }
.tracker-item .q-label { font-weight: 600; color: #444; }
.tracker-item .correction { color: #c0392b; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🧠 IEP Team Trivia</h1>
<p>How well do you know our teams? 34 questions across all IEP pillars!</p>
</div>
<!-- NAME ENTRY -->
<div class="card" id="name-card">
<div class="question-num">Welcome!</div>
<div class="question">Enter your name to start the quiz</div>
<input type="text" class="name-input" id="player-name" placeholder="Your name..." onkeydown="if(event.key==='Enter'){event.preventDefault();startQuiz();}">
<div class="btn-row"><button class="btn" onclick="startQuiz()">Start Quiz →</button></div>
</div>

<!-- QUIZ -->
<div class="hidden" id="quiz-section">
<div class="score-bar">
<span class="progress" id="progress">Question 1 / 30</span>
<span class="timer-display" id="timer-display">⏱️ 0s</span>
<span id="score-display">Score: 0</span>
</div>
<div class="card" id="quiz-card">
<div class="question-num" id="q-num">Question 1</div>
<div class="question" id="q-text"></div>
<div class="options" id="options"></div>
<div class="feedback hidden" id="feedback"></div>
<div class="btn-row"><button class="btn hidden" id="next-btn" onclick="nextQuestion()">Next →</button></div>
</div>
<!-- ANSWER TRACKER -->
<div class="card" id="tracker-card">
<div class="tracker">
<h3>📋 Your Answers</h3>
<div id="tracker-list"></div>
</div>
</div>
</div>

<!-- RESULTS -->
<div class="card hidden" id="results-card">
<div style="text-align:center;">
<h2 style="font-size:28px; color:#4a2d6b; margin-bottom:20px;">🎉 Quiz Complete!</h2>
<div style="font-size:48px; font-weight:700; color:#667eea; margin:20px 0;" id="final-score"></div>
<div style="font-size:16px; color:#555; margin-bottom:8px;" id="final-message"></div>
<div style="font-size:14px; color:#888; margin-bottom:24px;" id="final-time"></div>
<button class="btn" onclick="finishAndShowLeaderboard()">See Leaderboard →</button>
<button class="btn" style="background:linear-gradient(135deg,#2ecc71,#27ae60); margin-left:10px;" onclick="newPlayer()">Next Player →</button>
</div>
<!-- Individual tracker summary -->
<div class="tracker" style="margin-top:30px;">
<h3>📋 Your Answer Summary</h3>
<div id="results-tracker"></div>
</div>
</div>

<!-- LEADERBOARD -->
<div class="card hidden" id="leaderboard-card">
<div style="text-align:center; margin-bottom:24px;">
<h2 style="font-size:24px; color:#4a2d6b;">🏆 Leaderboard</h2>
<p style="font-size:14px; color:#888; margin-top:6px;">Top performers across all players</p>
</div>
<div id="leaderboard-content"></div>
<div class="btn-row" style="text-align:center; margin-top:24px;">
<button class="btn" onclick="newPlayer()">Next Player →</button>
<button class="btn" style="background:linear-gradient(135deg,#e74c3c,#c0392b); margin-left:10px;" onclick="resetAll()">Reset All</button>
</div>
</div>
</div>

let allPlayers = [];
try { allPlayers = JSON.parse(localStorage.getItem('iep_trivia_players') || '[]'); } catch(e) { allPlayers = []; }
let currentPlayer = '';
let current = 0;
let score = 0;
let answers = [];
let questionStartTime = 0;
let quizStartTime = 0;
let totalTime = 0;
let questionTimes = [];

function shuffle(arr) {
  for(let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz() {
  const name = document.getElementById('player-name').value.trim();
  if(!name) { document.getElementById('player-name').style.borderColor = '#e74c3c'; return; }
  currentPlayer = name;
  current = 0;
  score = 0;
  answers = [];
  questionTimes = [];
  shuffle(questions);
  quizStartTime = Date.now();
  document.getElementById('name-card').classList.add('hidden');
  document.getElementById('quiz-section').classList.remove('hidden');
  document.getElementById('tracker-list').innerHTML = '';
  loadQuestion();
}

function loadQuestion() {
  const q = questions[current];
  document.getElementById('q-num').textContent = `Question ${current + 1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress').textContent = `Question ${current + 1} / ${questions.length}`;
  document.getElementById('score-display').textContent = `Score: ${score}`;
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');
  questionStartTime = Date.now();
  updateTimer();
  
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  const shuffled = shuffle([...q.o]);
  shuffled.forEach(opt => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    div.onclick = () => selectAnswer(div, opt, q.a, q.q);
    optionsDiv.appendChild(div);
  });
}

let timerInterval;
function updateTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const elapsed = Math.round((Date.now() - quizStartTime) / 1000);
    const min = Math.floor(elapsed / 60);
    const sec = elapsed % 60;
    document.getElementById('timer-display').textContent = `⏱️ ${min > 0 ? min + 'm ' : ''}${sec}s`;
  }, 1000);
}

function selectAnswer(el, selected, correct, questionText) {
  const timeTaken = (Date.now() - questionStartTime) / 1000;
  questionTimes.push(timeTaken);
  
  const options = document.querySelectorAll('.option');
  options.forEach(o => {
    o.classList.add('disabled');
    if(o.textContent === correct) o.classList.add('correct');
  });
  
  const isCorrect = selected === correct;
  const ctx = questions[current].ctx;
  const fb = document.getElementById('feedback');
  if(isCorrect) {
    score++;
    fb.className = 'feedback correct';
    fb.innerHTML = `✅ Correct! (${timeTaken.toFixed(1)}s)<div style="margin-top:6px; font-size:13px; font-style:italic;">💡 ${ctx}</div>`;
  } else {
    el.classList.add('wrong');
    fb.className = 'feedback wrong';
    fb.innerHTML = `❌ Incorrect. The answer is: <b>${correct}</b><div style="margin-top:6px; font-size:13px; font-style:italic;">💡 ${ctx}</div>`;
  }
  fb.classList.remove('hidden');
  document.getElementById('score-display').textContent = `Score: ${score}`;
  document.getElementById('next-btn').classList.remove('hidden');
  
  // Track answer
  answers.push({ q: questionText, selected, correct, isCorrect, time: timeTaken, ctx });
  addTrackerItem(current + 1, questionText, selected, correct, isCorrect, timeTaken, ctx);
}

function addTrackerItem(num, questionText, selected, correct, isCorrect, time, ctx) {
  const list = document.getElementById('tracker-list');
  const div = document.createElement('div');
  div.className = `tracker-item ${isCorrect ? 'correct' : 'wrong'}`;
  if(isCorrect) {
    div.innerHTML = `<span class="q-label">Q${num}:</span> ✅ ${correct} <span style="color:#888; font-size:12px;">(${time.toFixed(1)}s)</span><div style="color:#555; font-size:12px; margin-top:4px; font-style:italic;">💡 ${ctx}</div>`;
  } else {
    div.innerHTML = `<span class="q-label">Q${num}:</span> ❌ You said: ${selected} <span style="color:#888; font-size:12px;">(${time.toFixed(1)}s)</span><div class="correction">→ Correct: <b>${correct}</b></div><div style="color:#555; font-size:12px; margin-top:4px; font-style:italic;">💡 ${ctx}</div>`;
  }
  list.prepend(div);
}

function nextQuestion() {
  current++;
  if(current >= questions.length) {
    showResults();
  } else {
    loadQuestion();
  }
}

function showResults() {
  clearInterval(timerInterval);
  totalTime = (Date.now() - quizStartTime) / 1000;
  const avgTime = totalTime / questions.length;
  
  // Save player result
  const playerResult = {
    name: currentPlayer,
    score: score,
    total: questions.length,
    totalTime: totalTime,
    avgTime: avgTime,
    answers: answers,
    timestamp: new Date().toISOString()
  };
  allPlayers.push(playerResult);
  localStorage.setItem('iep_trivia_players', JSON.stringify(allPlayers));
  
  // Show results
  document.getElementById('quiz-section').classList.add('hidden');
  document.getElementById('results-card').classList.remove('hidden');
  
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('final-score').textContent = `${score} / ${questions.length} (${pct}%)`;
  document.getElementById('final-time').textContent = `⏱️ Total time: ${formatTime(totalTime)} | Avg per question: ${avgTime.toFixed(1)}s`;
  
  let msg = '';
  if(pct >= 90) msg = '🏆 IEP Expert! You know the org inside out.';
  else if(pct >= 70) msg = '🌟 Great job! Solid knowledge across the teams.';
  else if(pct >= 50) msg = '👍 Not bad! A few more QBRs and you\'ll nail it.';
  else msg = '📚 Time to review the team scopes — you\'ve got this!';
  document.getElementById('final-message').textContent = `${currentPlayer} — ${msg}`;
  
  // Build answer summary
  const summaryDiv = document.getElementById('results-tracker');
  summaryDiv.innerHTML = '';
  answers.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = `tracker-item ${a.isCorrect ? 'correct' : 'wrong'}`;
    if(a.isCorrect) {
      div.innerHTML = `<span class="q-label">Q${i+1}:</span> ✅ ${a.correct} <span style="color:#888; font-size:12px;">(${a.time.toFixed(1)}s)</span><div style="color:#555; font-size:12px; margin-top:4px; font-style:italic;">💡 ${a.ctx}</div>`;
    } else {
      div.innerHTML = `<span class="q-label">Q${i+1}:</span> ❌ You said: ${a.selected} <span style="color:#888; font-size:12px;">(${a.time.toFixed(1)}s)</span><div class="correction">→ Correct: <b>${a.correct}</b></div><div style="color:#555; font-size:12px; margin-top:4px; font-style:italic;">💡 ${a.ctx}</div>`;
    }
    summaryDiv.appendChild(div);
  });
}

function formatTime(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = Math.round(seconds % 60);
  return min > 0 ? `${min}m ${sec}s` : `${sec}s`;
}

function finishAndShowLeaderboard() {
  document.getElementById('results-card').classList.add('hidden');
  document.getElementById('leaderboard-card').classList.remove('hidden');
  renderLeaderboard();
}

function renderLeaderboard() {
  const content = document.getElementById('leaderboard-content');
  if(allPlayers.length === 0) {
    content.innerHTML = '<p style="text-align:center; color:#888;">No players yet!</p>';
    return;
  }
  
  // Top 3 by score (tiebreak by time - faster wins)
  const byScore = [...allPlayers].sort((a, b) => b.score - a.score || a.totalTime - b.totalTime);
  const top3Score = byScore.slice(0, 3);
  
  // Top 3 by speed (minimum 50% correct to qualify)
  const qualified = allPlayers.filter(p => p.score >= p.total * 0.5);
  const bySpeed = [...qualified].sort((a, b) => a.avgTime - b.avgTime);
  const top3Speed = bySpeed.slice(0, 3);
  
  const medals = ['🥇', '🥈', '🥉'];
  
  let html = '<div style="margin-bottom:24px;">';
  html += '<h3 style="font-size:16px; color:#4a2d6b; margin-bottom:12px;">🏆 Most Correct Answers</h3>';
  html += '<table style="width:100%; font-size:14px; border-collapse:separate; border-spacing:0 6px;">';
  html += '<tr style="color:#888; font-size:12px; text-transform:uppercase;"><td style="padding:4px 12px;">Rank</td><td>Player</td><td>Score</td><td>Time</td><td>Avg/Q</td></tr>';
  top3Score.forEach((p, i) => {
    const bg = i === 0 ? '#fff8e6' : i === 1 ? '#f8f8f8' : '#fdf5ef';
    html += `<tr style="background:${bg}; border-radius:8px;">`;
    html += `<td style="padding:10px 12px; border-radius:8px 0 0 8px; font-size:20px;">${medals[i]}</td>`;
    html += `<td style="padding:10px 8px; font-weight:600;">${p.name}</td>`;
    html += `<td style="padding:10px 8px;">${p.score}/${p.total}</td>`;
    html += `<td style="padding:10px 8px;">${formatTime(p.totalTime)}</td>`;
    html += `<td style="padding:10px 12px; border-radius:0 8px 8px 0; color:#888;">${p.avgTime.toFixed(1)}s</td>`;
    html += '</tr>';
  });
  html += '</table></div>';
  
  html += '<div>';
  html += '<h3 style="font-size:16px; color:#4a2d6b; margin-bottom:12px;">⚡ Fastest Responders <span style="font-size:12px; color:#888; font-weight:400;">(min 50% correct to qualify)</span></h3>';
  if(top3Speed.length === 0) {
    html += '<p style="color:#888; font-size:13px;">No qualified players yet (need ≥50% correct)</p>';
  } else {
    html += '<table style="width:100%; font-size:14px; border-collapse:separate; border-spacing:0 6px;">';
    html += '<tr style="color:#888; font-size:12px; text-transform:uppercase;"><td style="padding:4px 12px;">Rank</td><td>Player</td><td>Avg/Q</td><td>Score</td><td>Total Time</td></tr>';
    top3Speed.forEach((p, i) => {
      const bg = i === 0 ? '#e8faf0' : i === 1 ? '#f8f8f8' : '#f0f8ff';
      html += `<tr style="background:${bg};">`;
      html += `<td style="padding:10px 12px; border-radius:8px 0 0 8px; font-size:20px;">${medals[i]}</td>`;
      html += `<td style="padding:10px 8px; font-weight:600;">${p.name}</td>`;
      html += `<td style="padding:10px 8px; font-weight:600; color:#2ecc71;">${p.avgTime.toFixed(1)}s</td>`;
      html += `<td style="padding:10px 8px;">${p.score}/${p.total}</td>`;
      html += `<td style="padding:10px 12px; border-radius:0 8px 8px 0; color:#888;">${formatTime(p.totalTime)}</td>`;
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  
  // All players table
  if(allPlayers.length > 3) {
    html += '<div style="margin-top:24px; border-top:1px solid #eee; padding-top:16px;">';
    html += '<h3 style="font-size:14px; color:#888; margin-bottom:10px;">All Players</h3>';
    html += '<table style="width:100%; font-size:13px; border-collapse:separate; border-spacing:0 4px;">';
    byScore.forEach((p, i) => {
      html += `<tr style="background:${i%2===0?'#fafafa':'white'};">`;
      html += `<td style="padding:8px 12px;">${i+1}</td>`;
      html += `<td style="padding:8px;">${p.name}</td>`;
      html += `<td style="padding:8px;">${p.score}/${p.total}</td>`;
      html += `<td style="padding:8px;">${formatTime(p.totalTime)}</td>`;
      html += `<td style="padding:8px; color:#888;">${p.avgTime.toFixed(1)}s/q</td>`;
      html += '</tr>';
    });
    html += '</table></div>';
  }
  
  content.innerHTML = html;
}

function newPlayer() {
  document.getElementById('results-card').classList.add('hidden');
  document.getElementById('leaderboard-card').classList.add('hidden');
  document.getElementById('quiz-section').classList.add('hidden');
  document.getElementById('name-card').classList.remove('hidden');
  document.getElementById('player-name').value = '';
  document.getElementById('player-name').style.borderColor = '#e8e8e8';
}

function resetAll() {
  if(confirm('This will clear all player scores. Are you sure?')) {
    allPlayers = [];
    localStorage.removeItem('iep_trivia_players');
    newPlayer();
  }
}
</script>
